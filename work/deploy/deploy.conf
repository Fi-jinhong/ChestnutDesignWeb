# ===== 部署配置：填入你的服务器信息 =====

# 服务器公网 IP
SERVER_IP="124.223.104.141"

# SSH 登录用户名（阿里云 ECS 默认 root；Ubuntu 镜像可能是 ubuntu）
SERVER_USER="root"

# SSH 私钥路径（用密码登录则留空，脚本会提示输入密码）
SSH_KEY=""

# 已备案的域名（不带 http://，例如 example.com）
DOMAIN="chestnut.hi.cn"

# 服务器上网站存放目录（宝塔面板站点根目录）
REMOTE_DIR="/www/wwwroot/chestnut.hi.cn"
