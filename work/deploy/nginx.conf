# 栗子作品集网站 Nginx 配置
# 部署到服务器：/etc/nginx/sites-available/chestnut
# 注意：首次部署时脚本会自动把 __DOMAIN__ 替换为 deploy.conf 中的域名

server {
    listen 80;
    server_name __DOMAIN__ www.__DOMAIN__;

    root /var/www/chestnut;
    index index.html;

    # 单页路由兜底：/projects/xxx 等目录式 URL
    location / {
        try_files $uri $uri/ $uri/index.html $uri.html =404;
    }

    # 静态资源长缓存（图片/字体/压缩后的 css/js）
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # PDF 简历/作品集：较短缓存，强制下载类型正确
    location ~* \.pdf$ {
        expires 1d;
        add_header Content-Disposition "inline";
    }

    # 大文件上传/超时余量（站点有 185M 静态资源，主要是首访加载体验）
    client_max_body_size 10m;

    # gzip 压缩
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;

    # 基础安全头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# ===== HTTPS 配置（申请证书后由 certbot 自动改写本文件）=====
# 部署完成后在服务器上执行：
#   apt install -y certbot python3-certbot-nginx
#   certbot --nginx -d __DOMAIN__ -d www.__DOMAIN__
# certbot 会自动添加 443 server 块并把 80 跳转 HTTPS。
