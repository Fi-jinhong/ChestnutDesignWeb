# 栗子作品集 —— 宝塔面板站点配置（静态站）
# 用法：宝塔 → 网站 → chestnut.hi.cn → 设置 → 配置文件，整段替换粘贴
# 根目录按你的实际路径调整（下方 root 一行为宝塔默认路径）

server {
    listen 80;
    server_name chestnut.hi.cn www.chestnut.hi.cn;
    index index.html index.htm;
    root /www/wwwroot/chestnut.hi.cn;

    # -------- SSL 配置（宝塔 SSL → Let's Encrypt 申请后自动追加，这里预留说明）--------
    # listen 443 ssl http2;
    # ssl_certificate    /www/server/panel/vhost/cert/chestnut.hi.cn/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/chestnut.hi.cn/privkey.pem;
    # if ($server_port !~ 443){ rewrite ^(/.*)$ https://$host$1 permanent; }

    # -------- 静态站路由：/projects/xxx 这类目录式 URL 兜底 --------
    location / {
        try_files $uri $uri/ $uri/index.html $uri.html =404;
    }

    # -------- 图片 / 字体 / 样式缓存 30 天 --------
    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?|css|js|mp4)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # -------- PDF（简历 6.8M / 作品集 56M）--------
    location ~* \.pdf$ {
        expires 1d;
        types { application/pdf pdf; }
        add_header Content-Disposition "inline";
    }

    # 大文件体积余量
    client_max_body_size 20m;

    # -------- gzip 压缩 --------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # -------- 安全头 --------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log  /www/wwwlogs/chestnut.hi.cn.log;
    error_log   /www/wwwlogs/chestnut.hi.cn.error.log;
}
